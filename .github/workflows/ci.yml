name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      LLVM_MINGW: llvm-mingw-20261006-ucrt-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # MinGW clang, not the runner's MSVC clang: build.ps1 uses MinGW linker flags.
      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$env:LLVM_MINGW.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llvm.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$env:LLVM_MINGW\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet restore app/Imago.csproj
          $out = dotnet list app/Imago.csproj package --vulnerable --include-transitive | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable packages found' }

      - name: Build, harden, self-test
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imago-dist
          path: dist/
          if-no-files-found: error
